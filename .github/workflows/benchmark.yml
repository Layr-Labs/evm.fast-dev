name: Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    # 128 GB host: the verifier caps each build unit at 112 GiB, with up to 30 Lean processes.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    # The verifier has no time limit of its own; stay under the 24-hour job token.
    timeout-minutes: 1380
    env:
      # Full verification: comparator export and Lean kernel replay (see AGENTS.md).
      INIT_E_VERIFICATION: comparator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: work/trusted-cache.tar.zst
          key: verifier-ubuntu26-vm-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'Guest.lean', 'Guest/**', 'InitE.lean', 'InitE/**', 'verifier/**', 'tools/build-lean.sh', 'tools/limited-lake.py', 'tools/lean-process-limit.c', 'scripts/setup.sh', 'scripts/blacksmith.sh', 'scripts/vm-setup.sh') }}-v1
      - name: Start verifier VM
        run: bash scripts/blacksmith.sh start
      - name: Setup
        run: bash scripts/blacksmith.sh setup
      # Save trusted builds before candidate verification, even if the proof fails.
      # Only the default branch publishes caches shared with submission branches.
      - name: Export trusted cache
        if: steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        run: bash scripts/blacksmith.sh cache
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        with:
          path: work/trusted-cache.tar.zst
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Benchmark
        run: bash scripts/blacksmith.sh run
      - name: Collect results
        if: always()
        run: bash scripts/blacksmith.sh collect
      # On the host, outside the verifier VM: reads the current record from Yukon's public API.
      - name: Add verification time to the score
        env:
          YUKON_API_URL: ${{ vars.YUKON_API_URL }}
        run: python3 scripts/time_score.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-score
          path: scripts/score.json
          if-no-files-found: error
      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifier-logs
          path: |
            work/yukon/*/*.log
            work/vm-console.log
          if-no-files-found: ignore
      - name: Stop verifier VM
        if: always()
        run: bash scripts/blacksmith.sh stop
