name: Boosted Benchmark
# Experimental copy of benchmark.yml with a non-blocking boost.ci prebuild step.
# benchmark.yml stays the official scoring workflow; this file never feeds Yukon.
on:
  workflow_dispatch:
    inputs:
      submission_ref:
        description: Branch or SHA whose editable paths to verify (empty = this commit)
        required: false
        default: ''
  # Lets ci/boost-* branches run this file before it exists on main.
  # Pushes only run when the head commit message contains [boosted-benchmark].
  push:
    branches: ['ci/boost-*']
permissions:
  contents: read
  # GitHub OIDC token for boost.ci: proves repo/ref/workflow, no stored secret.
  id-token: write
concurrency:
  group: boosted-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[boosted-benchmark]')
    # 128 GB host: the verifier caps each build unit at 112 GiB, with up to 30 Lean processes.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    # The verifier has no time limit of its own; stay under the 24-hour job token.
    timeout-minutes: 1380
    env:
      # Full verification: comparator export and Lean kernel replay (see AGENTS.md).
      INIT_E_VERIFICATION: comparator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Enough history to find the main commit our trusted files come from (see below).
          fetch-depth: 200
          filter: blob:none
      # Pick the submission to verify: dispatch input, or "submission=<ref>" in the commit message.
      - name: Select submission
        id: target
        env:
          INPUT_REF: ${{ inputs.submission_ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ref="$INPUT_REF"
          if [[ -z "$ref" ]]; then
            ref="$(grep -oE 'submission=[A-Za-z0-9._/-]+' <<<"$COMMIT_MESSAGE" | head -1 | cut -d= -f2 || true)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # boost.ci keys its warm images by the commit the trusted files come from: the last
          # first-parent commit touching anything but .github/ and the editable paths.
          base="$(git log --first-parent -1 --format=%H -- . ':!.github' ':!submission/Solution.lean' \
            ':!submission/claim.json' ':!submission/InitECandidate/Solver')"
          echo "base=${base:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # "smoke" in the commit message: boost.ci dry run only, no verifier VM.
          if grep -qw smoke <<<"$COMMIT_MESSAGE"; then echo "smoke=true" >> "$GITHUB_OUTPUT"; fi
          # "boost_fake=compile_failed:<Module>" tests a verifier path without calling boost.ci.
          fake="$(grep -oE 'boost_fake=compile_failed:[A-Za-z0-9_.]+' <<<"$COMMIT_MESSAGE" | head -1 | cut -d: -f2 || true)"
          if [[ -n "$fake" ]]; then
            echo "fake={\"status\":\"compile_failed\",\"failing_module\":\"$fake\"}" >> "$GITHUB_OUTPUT"
          fi
          # "boost_warm_cache" builds and saves a branch-scoped trusted cache for repeated pilot runs.
          if grep -qw boost_warm_cache <<<"$COMMIT_MESSAGE"; then echo "warm_cache=true" >> "$GITHUB_OUTPUT"; fi
          # "boost_stock_only" skips boost.ci and runs stock scripts/blacksmith.sh run for a clean A/B baseline.
          if grep -qw boost_stock_only <<<"$COMMIT_MESSAGE"; then echo "stock_only=true" >> "$GITHUB_OUTPUT"; fi
          echo "Submission: ${ref:-this commit (${GITHUB_SHA})}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.target.outputs.ref != ''
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: work/candidate
          persist-credentials: false
      # Same editable paths as benchmark.json; everything else stays from this commit.
      - name: Overlay submission
        if: steps.target.outputs.ref != ''
        run: |
          rm -rf submission/Solution.lean submission/claim.json submission/InitECandidate/Solver
          cp work/candidate/submission/Solution.lean work/candidate/submission/claim.json submission/
          if [[ -d work/candidate/submission/InitECandidate/Solver ]]; then
            cp -r work/candidate/submission/InitECandidate/Solver submission/InitECandidate/
          fi
          echo "Verifying editable paths from $(git -C work/candidate rev-parse HEAD)"
      # Non-blocking: boost.ci prebuilds and quick-checks the submission while the VM boots and
      # sets up; the "boost.ci prebuild" step below waits for it. Its output is untrusted:
      # boosted_verify.py only uses it to skip work. It writes to work/boost/, which `start`
      # never tars into the VM, and records its PID and exit status there.
      - name: Start boost.ci prebuild
        continue-on-error: true
        env:
          BOOST_CI_API_URL: ${{ vars.BOOST_CI_API_URL || 'https://api.boost.ci/v1/prebuilds' }}
          BOOST_CI_AUDIENCE: ${{ vars.BOOST_CI_AUDIENCE || 'https://api.boost.ci' }}
          SUBMISSION_REF: ${{ steps.target.outputs.ref }}
          BOOST_DRY_RUN: ${{ steps.target.outputs.smoke || 'false' }}
          BOOST_BASE_SHA: ${{ steps.target.outputs.base }}
          BOOST_FAKE_RESULT: ${{ steps.target.outputs.fake }}
          STOCK_ONLY: ${{ steps.target.outputs.stock_only }}
        run: |
          date +%s > work/started
          if [[ "$STOCK_ONLY" == true ]]; then exit 0; fi
          mkdir -p work/boost
          date +%s > work/boost/started
          # Step output and summary files are only read when a step ends; the wait step forwards them.
          # setsid: the wait step can stop the whole process group.
          BOOST_OUT=work/boost GITHUB_OUTPUT=work/boost/output GITHUB_STEP_SUMMARY=work/boost/summary \
            setsid bash -c 'python3 .github/boost/prebuild.py; echo $? > work/boost/exit.new; mv work/boost/exit.new work/boost/exit' \
            > work/boost/prebuild.log 2>&1 < /dev/null &
          echo $! > work/boost/pid
          echo "boost.ci prebuild running as PID $(cat work/boost/pid)"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.target.outputs.smoke != 'true'
        id: cache
        with:
          path: work/trusted-cache.tar.zst
          key: verifier-ubuntu26-vm-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'Guest.lean', 'Guest/**', 'InitE.lean', 'InitE/**', 'verifier/**', 'tools/build-lean.sh', 'tools/limited-lake.py', 'tools/lean-process-limit.c', 'scripts/setup.sh', 'scripts/blacksmith.sh', 'scripts/vm-setup.sh') }}-v1
      - name: Start verifier VM
        if: steps.target.outputs.smoke != 'true'
        run: bash scripts/blacksmith.sh start
      - name: Setup
        if: steps.target.outputs.smoke != 'true'
        run: bash scripts/blacksmith.sh setup
      - name: Export trusted cache (pilot warm-cache opt-in)
        if: steps.target.outputs.smoke != 'true' && steps.target.outputs.warm_cache == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/blacksmith.sh cache
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.target.outputs.smoke != 'true' && steps.target.outputs.warm_cache == 'true' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: work/trusted-cache.tar.zst
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Trusted, before candidate code; outside the scored verifySeconds window.
      - name: Build boosted comparator
        if: steps.target.outputs.smoke != 'true' && steps.target.outputs.stock_only != 'true'
        run: bash .github/boost/guest.sh setup-comparator
      # Waits for the background prebuild (30 minutes from its start, as when it ran in the
      # foreground), then stages its finished result into the VM. Failure only means stock verify.
      - name: boost.ci prebuild (non-blocking preview)
        id: boost
        if: steps.target.outputs.stock_only != 'true'
        continue-on-error: true
        timeout-minutes: 31
        env:
          SMOKE: ${{ steps.target.outputs.smoke }}
        run: |
          started="$(cat work/boost/started 2>/dev/null || echo 0)"
          while [[ ! -f work/boost/exit ]] && (( $(date +%s) < started + 30 * 60 )); do sleep 5; done
          if [[ ! -f work/boost/exit ]]; then
            echo "::warning::boost.ci prebuild still running after 30 minutes; stopping it"
            kill -- "-$(cat work/boost/pid)" 2>/dev/null || true
          fi
          echo "Waited until $(( $(date +%s) - started )) s after the prebuild started"
          # The OIDC token appears only on its ::add-mask:: line, which never reached the runner.
          grep -v '::add-mask::' work/boost/prebuild.log || true
          cat work/boost/summary >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat work/boost/output >> "$GITHUB_OUTPUT" 2>/dev/null || true
          if [[ "$SMOKE" != true ]]; then bash .github/boost/guest.sh stage-boost; fi
          code="$(cat work/boost/exit 2>/dev/null || echo timeout)"
          if [[ "$code" != 0 ]]; then echo "prebuild exit status: $code"; exit 1; fi
      # Never saves caches unless boost_warm_cache is explicitly requested for a pilot run:
      # on main, benchmark.yml / warm-cache.yml publish the shared cache.
      # scripts/run.py scoring, with boosted_verify.py choosing the verifier path.
      - name: Benchmark
        id: benchmark
        if: steps.target.outputs.smoke != 'true'
        # pipefail: the verifier's exit status, not tee's, decides this step.
        shell: bash
        env:
          STOCK_ONLY: ${{ steps.target.outputs.stock_only }}
        run: |
          date +%s > work/pre_benchmark_done
          set -o pipefail
          if [[ "$STOCK_ONLY" == true ]]; then
            bash scripts/blacksmith.sh run | tee work/benchmark.log
          else
            bash .github/boost/guest.sh run | tee work/benchmark.log
          fi
      - name: Collect results
        if: always() && steps.target.outputs.smoke != 'true'
        run: bash scripts/blacksmith.sh collect
      # On the host, outside the verifier VM: reads the current record from Yukon's public API.
      - name: Add verification time to the score
        if: steps.target.outputs.smoke != 'true'
        env:
          YUKON_API_URL: ${{ vars.YUKON_API_URL }}
        run: python3 scripts/time_score.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.target.outputs.smoke != 'true'
        with:
          name: boosted-benchmark-score
          path: scripts/score.json
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boosted-logs
          path: |
            work/yukon/*/*.log
            work/vm-console.log
            work/boost/result.json
          if-no-files-found: ignore
      - name: Stop verifier VM
        if: always() && steps.target.outputs.smoke != 'true'
        run: bash scripts/blacksmith.sh stop
      # Pilot only: report the outcome to boost.ci (run id, step outcomes, verifySeconds), since
      # boost.ci cannot read this repo's Actions logs.
      - name: Report outcome to boost.ci
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          BOOST_OUTCOME: ${{ steps.boost.outcome }}
          BOOST_STATUS: ${{ steps.boost.outputs.status }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          seconds="$(python3 -c 'import json;print(json.load(open("scripts/score.json"))["metrics"]["verifySeconds"])' 2>/dev/null || echo none)"
          setup_s="$(( $(cat work/pre_benchmark_done 2>/dev/null || echo 0) - $(cat work/started 2>/dev/null || echo 0) ))"
          # The verifier report is run.py's JSON line; keep its status, path and a short reason.
          report="$(python3 .github/boost/report_summary.py work/benchmark.log work/yukon/*/*.log 2>/dev/null || echo none)"
          curl -s -m 10 -o /dev/null -G https://api.boost.ci/healthz \
            --data-urlencode "boosted_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data-urlencode "ref=${GITHUB_REF_NAME}" --data-urlencode "job=${JOB_STATUS}" \
            --data-urlencode "cache=${CACHE_HIT:-none}" --data-urlencode "setup_s=${setup_s}" \
            --data-urlencode "boost=${BOOST_OUTCOME:-skipped}:${BOOST_STATUS:-none}" \
            --data-urlencode "benchmark=${BENCHMARK_OUTCOME:-skipped}" \
            --data-urlencode "verify_seconds=${seconds}" --data-urlencode "report=${report}" || true
