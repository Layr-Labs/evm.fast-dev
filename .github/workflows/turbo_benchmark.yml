name: Turbo Benchmark
on:
  workflow_dispatch:
    inputs:
      submission_ref:
        description: Branch or SHA whose editable paths to verify (empty = this commit)
        required: false
        default: ''
  push:
    branches:
      - 'ci/*'
permissions:
  contents: read
concurrency:
  group: turbo-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[turbo-benchmark]')
    continue-on-error: true
    runs-on: lean-32vcpu-ubuntu-2604
    timeout-minutes: 360
    env:
      INIT_E_VERIFICATION: comparator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select submission
        id: target
        env:
          INPUT_REF: ${{ inputs.submission_ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ref="$INPUT_REF"
          if [[ -z "$ref" ]]; then
            ref="$(grep -oE 'submission=[A-Za-z0-9._/-]+' <<<"$COMMIT_MESSAGE" | head -1 | cut -d= -f2 || true)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Submission: ${ref:-this commit (${GITHUB_SHA})}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.target.outputs.ref != ''
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: work/candidate
          persist-credentials: false
      - name: Overlay submission
        if: steps.target.outputs.ref != ''
        run: |
          rm -rf submission/Solution.lean submission/claim.json submission/InitECandidate/Solver
          cp work/candidate/submission/Solution.lean work/candidate/submission/claim.json submission/
          if [[ -d work/candidate/submission/InitECandidate/Solver ]]; then
            cp -r work/candidate/submission/InitECandidate/Solver submission/InitECandidate/
          fi
          echo "Verifying editable paths from $(git -C work/candidate rev-parse HEAD)"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: work/trusted-cache.tar.zst
          key: verifier-ubuntu26-vm-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'Guest.lean', 'Guest/**', 'InitE.lean', 'InitE/**', 'verifier/**', 'tools/build-lean.sh', 'tools/limited-lake.py', 'tools/lean-process-limit.c', 'scripts/setup.sh', 'scripts/blacksmith.sh', 'scripts/vm-setup.sh') }}-v1
      - name: Preflight and stage judge workspace
        run: bash .github/turbo/host.sh start
      - name: Setup toolchain and spooled nanoda comparator
        run: bash .github/turbo/host.sh setup
      - name: Benchmark (turbo-lean + spooled nanoda)
        id: benchmark
        shell: bash
        run: set -o pipefail; bash .github/turbo/host.sh run | tee work/turbo-benchmark.log
      - name: Collect results
        if: always()
        run: bash .github/turbo/host.sh collect
      - name: Add verification time to the score
        env:
          YUKON_API_URL: ${{ vars.YUKON_API_URL }}
        run: python3 scripts/time_score.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turbo-benchmark-score
          path: scripts/score.json
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turbo-verifier-logs
          path: |
            work/turbo-benchmark.log
            work/yukon/*/*.log
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: bash .github/turbo/host.sh stop
